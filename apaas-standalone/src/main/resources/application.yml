server:
  port: 8080

spring:
  application:
    name: apaas-standalone
  
  # JDBC配置
  datasource:
    url: jdbc:mysql://localhost:3306/apaas?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    
  # R2DBC配置
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/apaas
    username: apaas
    password: apaas123
    pool:
      enabled: true
      initial-size: 10
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1
      
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 2000ms

logging:
  level:
    org.apaas: DEBUG