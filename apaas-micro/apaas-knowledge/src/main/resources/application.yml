server:
  port: 9500

spring:
  application:
    name: apaas-knowledge

  cloud:
    nacos:  # 单机版本关闭nacos 服务发现和配置管理的能力
      config:
        enabled: false
      discovery:
        enabled: false

  r2dbc:
    url: r2dbc:postgresql://jfast-postgresql:5432/jfast-cloud-knowledge
    username: postgres
    password: Postgresql@9527$
    pool:
      max-size: 10
      max-idle-time: 30m
      max-acquire-time: 30s

  # 响应式Redis配置
  data:
    redis:
      host: jfast-redis
      port: 6379
      password: Redis@9527$ # 如果没有密码，可注释或删除
      database: 0
      # 连接池配置 (可选)
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  datasource:
    url: jdbc:postgresql://localhost:5432/jfast-cloud-knowledge
    username: postgres
    password: Postgresql@9527$
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: deepseek-r1:1.5b
          temperature: 0.7
          max-tokens: 4096
      embedding:
        options:
          model: bge-m3:567m
          max-tokens: 4096

    vectorstore:
      pgvector:
        index-type: HNSW
        initializeSchema: true
      redis:
        index-name: jfast-knowledge
        prefix: 'jfast:knowledge:'
        initialize-schema: true

app:
  upload:
    dir: uploads
  rag:
    prompt:
      template: |
        你是一个企业知识库助手，请严格根据以下上下文回答问题：
        {context}
        
        问题：{question}
        
        回答时需满足：
        1. 仅基于上下文内容，不编造未知信息；
        2. 标注来源文档名称和位置（如【财务制度.pdf, P15】）；
        3. 若上下文无关，回复"未找到相关知识"。
    search:
      limit: 5
    timeout:
      seconds: 10

logging:
  level:
    org.springframework.data.r2dbc: DEBUG
    org.springframework.ai: DEBUG
    org.jfast: DEBUG