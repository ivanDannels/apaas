server:
  port: 8082
  servlet:
    context-path: /auth

spring:
  application:
    name: apaas-auth
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yml
        shared-configs:
          - data-id: application-common.yml
            refresh: true
  config:
    import:
      - optional:nacos:application-common.yml
      - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:apaas}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30000
      validation-query: SELECT 1
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms

logging:
  level:
    org.apaas: info
    org.springframework: warn

# 认证配置
auth:
  # 令牌有效期（默认30分钟）
  tokenValiditySeconds: 1800
  # 刷新令牌有效期（默认7天）
  refreshTokenValiditySeconds: 604800
  # 客户端配置
  clients:
    - clientId: web
      clientSecret: 123456
      redirectUris: http://localhost:8080/login/oauth2/code/web
      scopes: all
    - clientId: app
      clientSecret: 123456
      redirectUris: http://localhost:8080/login/oauth2/code/app
      scopes: all
    - clientId: gateway
      clientSecret: 123456
      redirectUris: http://localhost:8080/login/oauth2/code/gateway
      scopes: all

# SpringDoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: org.apaas.auth.controller

# 暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always