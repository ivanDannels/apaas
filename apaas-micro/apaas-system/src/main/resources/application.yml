server:
  port: 8081

spring:
  application:
    name: apaas-system
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:jfast-register}:${NACOS_PORT:8848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASSWORD:Nacos@9527}
      discovery:
        server-addr: ${NACOS_HOST:jfast-register}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:apaas}
      config:
        server-addr: ${NACOS_HOST:jfast-register}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:apaas}
        file-extension: yml
        refresh-enabled: true
  config:
    import:
      - optional:nacos:application.yml
      - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  autoconfigure:
    exclude:
      - org.springdoc.core.configuration.SpringDocKotlinConfiguration
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:jfast-postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:apaas}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Postgresql@9527$}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1
  sql:
    init:
      mode: always
  data:
    redis:
      client-type: lettuce
      host: ${REDIS_HOST:10.100.20.61}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Redis@9527$}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: 5000ms

logging:
  level:
    org.apaas: info
    org.springframework: warn

# MinIO配置
minio:
  endpoint: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: ${MINIO_BUCKET:apaas}

# 系统配置
system:
  # 文件上传路径
  uploadPath: /tmp/upload
  # 文件上传类型
  uploadType: minio
  # 文件上传大小限制
  maxFileSize: 100MB
  # 文件上传总大小限制
  maxRequestSize: 200MB

# SpringDoc配置
springdoc:
  enable-kotlin: false
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: org.apaas

# 暴露监控端点
management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always