server:
  port: 8083

spring:
  application:
    name: apaas-flow-execution
  
  # 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/apaas_flow_execution?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: apaas
    password: apaas123
  
  # R2DBC配置
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/apaas_flow_execution
    username: apaas
    password: apaas123
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 2000ms

  # 配置中心
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml

# 日志配置
logging:
  level:
    org.apaas.flow.execution: debug
  
# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always