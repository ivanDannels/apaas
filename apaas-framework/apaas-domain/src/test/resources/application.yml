spring:
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false
  main:
    web-application-type: reactive
  r2dbc:
#    url: r2dbc:postgresql://10.100.20.61:5432/apaas
#    username: postgres
#    password: Postgresql@9527$
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always
  datasource:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 5000
      leak-detection-threshold: 60000
  # Redis配置
  data:
    redis:
      host: 10.100.20.61
      port: 6379
      password: Redis@9527$
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms


logging:
  level:
    root: DEBUG
    org.apaas: DEBUG
