server:
  port: 8080

spring:
  application:
    name: apaas-gateway
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: ${spring.cloud.nacos.discovery.namespace}
        file-extension: yml
        shared-configs:
          - data-id: application-common.yml
            refresh: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 系统服务
        - id: apaas-system
          uri: lb://apaas-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        # 权限中心服务
        - id: apaas-auth
          uri: lb://apaas-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        # 监控服务
        - id: apaas-monitor
          uri: lb://apaas-monitor
          predicates:
            - Path=/monitor/**
          filters:
            - StripPrefix=1
        # 流程引擎服务
        - id: apaas-flow-engine
          uri: lb://apaas-flow-engine
          predicates:
            - Path=/flow/engine/**
          filters:
            - StripPrefix=2
        # 流程执行服务
        - id: apaas-flow-execution
          uri: lb://apaas-flow-execution
          predicates:
            - Path=/flow/execution/**
          filters:
            - StripPrefix=2
        # 调度任务服务
        - id: apaas-job
          uri: lb://apaas-job
          predicates:
            - Path=/job/**
          filters:
            - StripPrefix=1
        # 集成服务
        - id: apaas-integration
          uri: lb://apaas-integration
          predicates:
            - Path=/integration/**
          filters:
            - StripPrefix=1
        # 报表服务
        - id: apaas-report
          uri: lb://apaas-report
          predicates:
            - Path=/report/**
          filters:
            - StripPrefix=1
        # 开发平台服务
        - id: apaas-design-platform
          uri: lb://apaas-design-platform
          predicates:
            - Path=/design/**
          filters:
            - StripPrefix=1

  # Redis配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: info
    org.apaas.gateway: debug

# 暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always